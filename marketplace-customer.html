<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Маркетплейс товаров — интерфейс покупателя</title>
<style>
/* ============================================================
   МАРКЕТПЛЕЙС ТОВАРОВ — СТИЛИ ПРОТОТИПА
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700;800&display=swap');

:root {
  --ink: #1C231F;
  --ink-soft: #4B5450;
  --muted: #74807A;
  --paper: #F3F1E9;
  --surface: #FFFFFF;
  --surface-2: #EAE7DB;
  --line: #E1DDCE;
  --line-strong: #CFC9B6;

  --primary: #1F3D3A;
  --primary-dark: #142826;
  --primary-tint: #E4EBE6;

  --accent: #FF6A3D;
  --accent-dark: #E15420;
  --accent-tint: #FFE6DB;

  --success: #2F9E67;
  --success-tint: #E2F4EA;
  --warning: #D98B1F;
  --warning-tint: #FBEDD7;
  --danger: #D6483F;
  --danger-tint: #FBE4E1;

  --map-bg: #EAE6D6;
  --map-block: #DFDABE;
  --map-line: #C7C0A4;
  --map-green: #AEC49E;

  --font-display: 'Unbounded', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow-card: 0 1px 2px rgba(28,35,31,0.05), 0 6px 16px -8px rgba(28,35,31,0.12);
  --shadow-pop: 0 20px 50px -12px rgba(20,25,22,0.35);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: #DAD5C4;
  -webkit-font-smoothing: antialiased;
}
#root { height: 100%; }
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
ul { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* ---------- КАРКАС ПРИЛОЖЕНИЯ ---------- */

.app-shell {
  position: relative;
  height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  background: var(--paper);
  overflow: hidden;
}

@media (min-width: 660px) {
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5), transparent 45%),
      repeating-linear-gradient(90deg, #CFC9B4 0 3px, transparent 3px 26px),
      #DAD5C4;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 0;
  }
  .app-shell {
    height: 872px;
    max-height: calc(100vh - 56px);
    border-radius: 34px;
    box-shadow: var(--shadow-pop);
    border: 1px solid rgba(20,25,22,0.08);
  }
}

#app { display: flex; flex-direction: column; height: 100%; position: relative; }
#modal-host { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
#modal-host:empty { display: none; }
.modal-overlay { pointer-events: auto; }

.screen-scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.content-pad { padding: 4px 18px 28px; }
.content-pad-fab { padding-bottom: 96px; }

/* ---------- ШАПКА ---------- */

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 12px 10px;
  position: sticky; top: 0; z-index: 5;
  background: var(--paper);
}
.topbar-title { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 11px; border: none;
  background: var(--surface-2); color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.icon-btn-spacer { width: 36px; height: 36px; flex-shrink: 0; }

.brand-row {
  display: flex; align-items: center; gap: 11px;
  padding: 18px 18px 6px;
}
.brand-mark { flex-shrink: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.brand-sub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }

/* ---------- НИЖНЯЯ НАВИГАЦИЯ ---------- */

.bottom-nav {
  flex-shrink: 0;
  display: flex;
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding: 7px 6px calc(env(safe-area-inset-bottom, 0px) + 7px);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; padding: 6px 2px; color: var(--muted);
  border-radius: 12px;
}
.nav-btn.active { color: var(--primary); }
.nav-ico { position: relative; display: inline-flex; }
.nav-label { font-size: 10.5px; font-weight: 600; }
.nav-badge {
  position: absolute; top: -4px; right: -8px;
  background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 700;
  min-width: 15px; height: 15px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
}

/* ---------- ТОСТ ---------- */

.toast {
  position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 11px 16px; border-radius: 999px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 600;
  box-shadow: 0 10px 30px -8px rgba(0,0,0,0.5);
  z-index: 50; max-width: calc(100% - 40px);
  animation: toast-in 0.22s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- КНОПКИ ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: none; border-radius: var(--radius-sm);
  font-family: var(--font-body); font-weight: 700; font-size: 14px;
  padding: 12px 16px; white-space: nowrap;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn-block { display: flex; width: 100%; margin-top: 10px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--primary-tint); color: var(--primary); }
.btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--line-strong); }
.btn-sm { padding: 8px 12px; font-size: 12.5px; border-radius: 9px; }
.btn-xs { padding: 6px 10px; font-size: 11.5px; border-radius: 8px; }

.fab {
  position: absolute; right: 18px; bottom: 78px;
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 24px -6px rgba(255,106,61,0.55);
  z-index: 10;
}
.fab:active { transform: scale(0.94); }

/* ---------- ПОИСК ---------- */

.searchbar {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 15px; padding: 4px 6px 4px 14px;
  margin: 6px 0 22px;
}
.searchbar-ico { color: var(--muted); display: flex; flex-shrink: 0; }
.searchbar-input {
  flex: 1; border: none; background: none; outline: none;
  font-size: 14.5px; padding: 10px 0; min-width: 0;
}
.searchbar-input::placeholder { color: #A7A99C; }
.searchbar-cam {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: 11px;
  background: var(--primary); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
}

/* ---------- РАЗДЕЛЫ / ЗАГОЛОВКИ ---------- */

.section-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin: 22px 0 12px;
}
.section-head h2 { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; }
.section-sub { font-size: 12px; color: var(--muted); font-weight: 500; }

/* ---------- КАТЕГОРИИ (ГЛАВНАЯ) ---------- */

.cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.cat-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 16px 14px;
  text-align: left; box-shadow: var(--shadow-card);
}
.cat-card-ico {
  width: 42px; height: 42px; border-radius: 12px;
  background: color-mix(in srgb, var(--cat-color) 14%, white);
  color: var(--cat-color);
  display: flex; align-items: center; justify-content: center;
}
.cat-card-name { font-size: 13px; font-weight: 700; line-height: 1.25; }

/* ---------- ТОВАРНЫЕ КАРТОЧКИ ---------- */

.card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

.listing-card {
  display: flex; flex-direction: column; text-align: left;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card);
}
.listing-card-photo {
  position: relative; aspect-ratio: 1 / 1; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(155deg, color-mix(in srgb, var(--cat-color) 22%, white), color-mix(in srgb, var(--cat-color) 7%, white));
  color: var(--cat-color);
}
.fav-btn {
  position: absolute; top: 7px; right: 7px; width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.92); border: none; color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}
.fav-btn.fav-active { color: var(--accent); }
.listing-card-body { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.listing-card-name { font-size: 12.5px; font-weight: 700; line-height: 1.3; min-height: 2.4em; }
.listing-card-desc {
  font-size: 11px; color: var(--muted); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.listing-card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.mini-tag { font-size: 9.5px; font-weight: 700; background: var(--surface-2); color: var(--ink-soft); padding: 2px 6px; border-radius: 5px; }
.listing-card-bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 5px; flex-wrap: wrap; }
.listing-card-price { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; }

.product-list { display: flex; flex-direction: column; gap: 9px; }
.product-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 11px 13px;
  text-align: left; box-shadow: var(--shadow-card);
}
.product-card-thumb {
  width: 44px; height: 44px; border-radius: 11px; flex-shrink: 0;
  background: var(--surface-2); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
}
.product-card-body { flex: 1; min-width: 0; }
.product-card-name { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
.product-card-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.product-card-price { font-family: var(--font-display); font-weight: 600; font-size: 14px; flex-shrink: 0; }

.product-hero { text-align: center; padding: 22px 10px 6px; }
.product-hero-thumb {
  width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 20px;
  background: color-mix(in srgb, var(--cat-color) 14%, white); color: var(--cat-color);
  display: flex; align-items: center; justify-content: center;
}
.product-hero-name { font-size: 17px; font-weight: 700; line-height: 1.3; }
.product-hero-cat { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.product-hero-price { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--accent-dark); margin-top: 10px; }

/* ---------- МАГАЗИНЫ ---------- */

.store-list { display: flex; flex-direction: column; gap: 9px; }
.store-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 12px 13px;
  text-align: left; box-shadow: var(--shadow-card);
  width: 100%;
}
.store-card-icon {
  width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
  background: color-mix(in srgb, var(--cat-color) 14%, white); color: var(--cat-color);
  display: flex; align-items: center; justify-content: center;
}
.store-card-icon-sm { width: 34px; height: 34px; border-radius: 10px; }
.store-card-icon-lg { width: 56px; height: 56px; border-radius: 16px; }
.store-card-body { flex: 1; min-width: 0; }
.store-card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.store-card-name { font-size: 14px; font-weight: 700; }
.store-card-meta {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--muted); margin-top: 3px;
}
.store-card-addr { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.store-card-count { font-size: 11px; color: var(--muted); margin-top: 4px; }
.store-card-arrow { color: var(--muted); flex-shrink: 0; }
.dot { color: var(--line-strong); }

.rating { display: inline-flex; align-items: center; gap: 3px; color: var(--warning); font-weight: 700; }
.rating-count { color: var(--muted); font-weight: 500; }

.badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 800; padding: 2.5px 6px; border-radius: 6px;
  text-transform: uppercase; letter-spacing: 0.02em;
}
.badge-business { background: var(--accent-tint); color: var(--accent-dark); }
.badge-verified { background: var(--primary-tint); color: var(--primary); text-transform: none; letter-spacing: 0; }

.store-hero { text-align: center; padding: 16px 4px 10px; }
.store-hero-name { font-size: 18px; font-weight: 700; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.store-hero-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-top: 12px; }
.store-hero-info { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; }
.store-hero-info-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.store-hero .btn-block { margin-top: 16px; }

.store-products { display: flex; flex-direction: column; }
.store-product-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 13px 2px; border-bottom: 1px solid var(--line);
}
.store-product-row:last-child { border-bottom: none; }
.store-product-name { font-size: 13.5px; font-weight: 600; }
.store-product-right { text-align: right; flex-shrink: 0; }
.store-product-price { font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }

.stock { font-size: 11px; font-weight: 700; display: inline-block; margin-top: 3px; }
.stock-ok { color: var(--success); }
.stock-low { color: var(--warning); }
.stock-out { color: var(--danger); }

/* ---------- КАТЕГОРИЯ / ПОДКАТЕГОРИИ ---------- */

.subcat-list { display: flex; flex-direction: column; gap: 8px; }
.link-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 14px 15px;
  font-size: 13.5px; font-weight: 600; text-align: left;
  margin-bottom: 8px; width: 100%;
}
.link-row-count { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.chev { display: inline-flex; color: var(--line-strong); }

/* ---------- ЧИПЫ / СЕГМЕНТЫ ---------- */

.chips-row {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 14px;
  scrollbar-width: none;
}
.chips-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; display: flex; align-items: center; gap: 5px;
  background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 999px; padding: 8px 13px; font-size: 12.5px; font-weight: 600;
  color: var(--ink-soft);
}
.chip-active { background: var(--primary); border-color: var(--primary); color: #fff; }

.segmented { display: flex; gap: 6px; padding: 0 18px 14px; }
.seg-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface-2); border: none; border-radius: 10px;
  padding: 9px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
}
.seg-active { background: var(--primary); color: #fff; }

/* ---------- КАРТА ---------- */

.map-slot { padding: 0 18px 18px; flex: 1; display: flex; }
.map-slot-tall { padding: 12px 18px 18px; }
.map-wrap { display: flex; flex-direction: column; width: 100%; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-card); flex: 1; min-height: 320px; position: relative; }
.map-canvas { position: relative; flex: 1; min-height: 260px; background: var(--map-bg); overflow: hidden; }
.map-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-pin {
  position: absolute; transform: translate(-50%, -100%);
  width: 30px; height: 30px; border-radius: 50% 50% 50% 4px;
  background: var(--pin-color); color: #fff;
  display: flex; align-items: center; justify-content: center;
  border: 2.5px solid #fff; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.35);
  transform-origin: bottom center;
}
.map-pin::after { content: ''; position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 7px; height: 7px; background: var(--pin-color); }
.map-pin-top { box-shadow: 0 0 0 3px var(--accent-tint), 0 4px 10px -2px rgba(0,0,0,0.35); }
.map-pin-active { transform: translate(-50%, -100%) scale(1.18); z-index: 3; }
.map-user-pin { position: absolute; transform: translate(-50%, -50%); }
.map-user-dot { display: block; width: 13px; height: 13px; border-radius: 50%; background: var(--primary); border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); position: relative; z-index: 2; }
.map-user-pulse {
  position: absolute; top: 50%; left: 50%; width: 13px; height: 13px; border-radius: 50%;
  background: var(--primary); opacity: 0.35; transform: translate(-50%, -50%);
  animation: pulse 2.2s ease-out infinite;
}
@keyframes pulse { 0% { transform: translate(-50%,-50%) scale(1); opacity: 0.4; } 100% { transform: translate(-50%,-50%) scale(3.4); opacity: 0; } }

.map-hint {
  display: flex; align-items: center; gap: 6px;
  padding: 11px 14px; background: var(--surface); font-size: 11.5px; color: var(--muted); font-weight: 600;
  border-top: 1px solid var(--line);
}
.map-sheet { background: var(--surface); border-top: 1px solid var(--line); padding: 13px 14px calc(env(safe-area-inset-bottom,0px) + 13px); }
.map-sheet-row { display: flex; align-items: center; gap: 11px; }
.map-sheet-info { flex: 1; min-width: 0; }
.map-sheet-actions { display: flex; gap: 8px; margin-top: 11px; }
.map-sheet-actions .btn { flex: 1; }

/* ---------- ПРЕДЛОЖЕНИЯ (СРАВНЕНИЕ ЦЕН) ---------- */

.offer-list { display: flex; flex-direction: column; gap: 10px; }
.offer-card-v2 {
  display: flex; gap: 11px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 12px; box-shadow: var(--shadow-card);
}
.offer-card-photo {
  position: relative; width: 68px; height: 68px; flex-shrink: 0; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(155deg, color-mix(in srgb, var(--cat-color) 22%, white), color-mix(in srgb, var(--cat-color) 7%, white));
  color: var(--cat-color);
}
.offer-card-photo .fav-btn { width: 22px; height: 22px; top: 4px; right: 4px; }
.offer-card-main { flex: 1; min-width: 0; }
.offer-store-name { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.offer-card-desc { font-size: 11px; color: var(--muted); line-height: 1.4; margin-top: 5px; }
.offer-row-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.offer-price-block { display: flex; flex-direction: column; }
.offer-price { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.offer-actions { display: flex; gap: 7px; }

/* ---------- КАРТОЧКА ТОВАРА (полная) ---------- */

.listing-hero-photo {
  position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-lg); margin-top: 6px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(155deg, color-mix(in srgb, var(--cat-color) 22%, white), color-mix(in srgb, var(--cat-color) 7%, white));
  color: var(--cat-color);
}
.fav-btn-lg {

/* ============================================================
   УТИЛИТЫ
   ============================================================ */

const USER_POS = { x: 50, y: 50 };

function formatPrice(n) {
  return n.toLocaleString('ru-RU') + ' ₽';
}

function distanceKm(store) {
  const dx = store.mx - USER_POS.x, dy = store.my - USER_POS.y;
  const d = Math.sqrt(dx * dx + dy * dy) * 0.09;
  return Math.max(0.3, Math.round(d * 10) / 10);
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function storeById(id) { return STORES.find(s => s.id === id); }
function categoryById(id) { return CATEGORIES.find(c => c.id === id); }
function subcatById(catId, subId) {
  const c = categoryById(catId);
  return c ? c.subcats.find(s => s.id === subId) : null;
}

function storesForCategory(catId, subId) {
  return STORES.filter(s => s.cat === catId && (!subId || s.subs.includes(subId)));
}

// Сортировка выдачи: бизнес-тариф — приоритет (топ-3), затем по рейтингу
function sortByPriority(stores) {
  return [...stores].sort((a, b) => {
    const pr = PLAN_RANK[a.plan] - PLAN_RANK[b.plan];
    if (pr !== 0) return pr;
    return b.rating - a.rating;
  });
}

// Группировка товаров по нормализованному названию — сравнение цен по магазинам
function searchProducts(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const groups = {};
  PRODUCT_POOL.forEach(p => {
    if (p.name.toLowerCase().includes(q)) {
      const key = p.name;
      if (!groups[key]) groups[key] = { name: p.name, cat: p.cat, offers: [] };
      groups[key].offers.push({ storeId: p.storeId, price: p.price, stock: p.stock, listingId: p.listingId, desc: p.desc, tags: p.tags });
    }
  });
  return Object.values(groups).map(g => {
    g.offers.sort((a, b) => a.price - b.price);
    g.minPrice = g.offers[0].price;
    return g;
  }).sort((a, b) => a.minPrice - b.minPrice);
}

function findProductGroup(name) {
  const all = PRODUCT_POOL.filter(p => p.name === name);
  const offers = all.map(p => ({ storeId: p.storeId, price: p.price, stock: p.stock, listingId: p.listingId, desc: p.desc, tags: p.tags }))
    .sort((a, b) => a.price - b.price);
  return { name, cat: all[0] ? all[0].cat : null, offers, minPrice: offers[0] ? offers[0].price : 0 };
}

// Демо «ИИ»-поиск по фото: детерминированный, но выглядит правдоподобно —
// подбирает категорию по «сигнатуре» файла и возвращает похожие товары.
function photoSearchResults(file) {
  const seed = (file && file.size ? file.size : 12345) + (file && file.name ? file.name.length : 3);
  const idx = seed % PRODUCT_POOL.length;
  const anchor = PRODUCT_POOL[idx];
  const sameCat = PRODUCT_POOL.filter(p => p.cat === anchor.cat);
  const names = [...new Set(sameCat.map(p => p.name))];
  const ordered = [anchor.name, ...names.filter(n => n !== anchor.name)].slice(0, 5);
  return ordered.map(n => findProductGroup(n));
}

function timeLeftLabel(expiresAt) {
  const ms = expiresAt - Date.now();
  if (ms <= 0) return null;
  const totalMin = Math.ceil(ms / 60000);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  if (h > 0) return `${h} ч ${m} мин`;
  return `${m} мин`;
}

function uid(prefix) {
  return prefix + Math.random().toString(36).slice(2, 9);
}

const state = {
  tab: 'catalog', // catalog | map | favorites | bookings | profile

  // --- каталог ---
  catalogScreen: { name: 'home' },
  catalogHistory: [],
  searchQuery: '',
  selectedPinId: null,

  // --- карта (вкладка) ---
  mapTabFilterCat: null,
  mapTabSelectedPinId: null,

  // --- избранное ---
  favorites: [], // массив listingId

  // --- брони покупателя ---
  bookings: [],

  // --- личный кабинет: сохранённые контактные данные для быстрой брони ---
  profile: null, // { name, phone } | null
  bookingEditingContact: false,

  // --- модалка бронирования ---
  bookingModal: null, // { storeId, itemName, price }

  // --- toast ---
  toast: null,
};

function render() {
  const root = document.getElementById('app');
  root.innerHTML = renderApp();
  const modalHost = document.getElementById('modal-host');
  modalHost.innerHTML = renderModals();
  window.scrollTo(0, 0);
  const scroller = document.getElementById('screen-scroll');
  if (scroller) scroller.scrollTop = 0;
}

function setTab(tab) {
  state.tab = tab;
  if (tab === 'catalog') {
    state.catalogScreen = { name: 'home' };
    state.catalogHistory = [];
  }
  render();
}

// Переход вперёд — текущий экран сохраняется в историю для кнопки «назад»
function goCatalog(screen) {
  state.tab = 'catalog';
  state.catalogHistory.push(state.catalogScreen);
  state.catalogScreen = screen;
  render();
}

// Замена текущего экрана без записи в историю (переключение вида/шага внутри одного экрана)
function goCatalogReplace(screen) {
  state.tab = 'catalog';
  state.catalogScreen = screen;
  render();
}

function goBack() {
  const prev = state.catalogHistory.pop();
  state.catalogScreen = prev || { name: 'home' };
  render();
}

function showToast(text) {
  state.toast = { text, id: uid('t_') };
  render();
  const myId = state.toast.id;
  setTimeout(() => {
    if (state.toast && state.toast.id === myId) {
      state.toast = null;
      render();
    }
  }, 2600);
}

function closeModal() {
  state.bookingModal = null;
  render();
}
/* ============================================================
   ОБОЛОЧКА ПРИЛОЖЕНИЯ: шапка, нижняя навигация, роутинг вкладок
   (интерфейс покупателя — без раздела продавца)
   ============================================================ */

function renderApp() {
  let body = '';
  if (state.tab === 'catalog') body = renderCatalogTab();
  else if (state.tab === 'map') body = renderMapTab();
  else if (state.tab === 'favorites') body = renderFavoritesTab();
  else if (state.tab === 'bookings') body = renderBookingsTab();
  else if (state.tab === 'profile') body = renderProfileTab();

  return `
    <div class="screen-scroll" id="screen-scroll">${body}</div>
    ${renderBottomNav()}
    ${renderToast()}
  `;
}

function renderModals() {
  return state.bookingModal ? renderBookingModal() : '';
}

function renderToast() {
  if (!state.toast) return '';
  return `<div class="toast">${icon('checkCircle', 18)}<span>${escapeHtml(state.toast.text)}</span></div>`;
}

function activeBookingsCount() {
  return state.bookings.filter(b => b.status === 'pending' || b.status === 'confirmed').length;
}

function renderBottomNav() {
  const tabs = [
    { id: 'catalog', label: 'Каталог', icon: 'grid' },
    { id: 'map', label: 'Карта', icon: 'map' },
    { id: 'favorites', label: 'Избранное', icon: 'heart', badge: state.favorites.length },
    { id: 'bookings', label: 'Брони', icon: 'bookmark', badge: activeBookingsCount() },
    { id: 'profile', label: 'Профиль', icon: 'user' },
  ];
  return `<nav class="bottom-nav">
    ${tabs.map(t => `
      <button class="nav-btn ${state.tab === t.id ? 'active' : ''}" onclick="setTab('${t.id}')">
        <span class="nav-ico">${icon(t.icon, 20, 1.7)}${t.badge ? `<span class="nav-badge">${t.badge}</span>` : ''}</span>
        <span class="nav-label">${t.label}</span>
      </button>`).join('')}
  </nav>`;
}

function topBar(title, opts) {
  opts = opts || {};
  const back = opts.onBack
    ? `<button class="icon-btn" onclick="${opts.onBack}">${icon('arrowLeft', 20)}</button>`
    : (opts.spacer ? `<span class="icon-btn-spacer"></span>` : '');
  const right = opts.right || `<span class="icon-btn-spacer"></span>`;
  return `<header class="topbar">
    ${back}
    <h1 class="topbar-title">${title}</h1>
    ${right}
  </header>`;
}

function planBadge(plan) {
  if (plan === 'business') return `<span class="badge badge-business">${icon('zap', 12, 2)} ТОП</span>`;
  return '';
}

function verifiedBadge(v) {
  return v ? `<span class="badge badge-verified">${icon('checkCircle', 12, 2)} Проверен</span>` : '';
}

function ratingLine(store) {
  return `<span class="rating">${icon('star', 13)} ${store.rating.toFixed(1)}
    <span class="rating-count">(${store.reviews})</span></span>`;
}

function storeCard(store, opts) {
  opts = opts || {};
  const dist = distanceKm(store);
  const catInfo = categoryById(store.cat);
  return `<button class="store-card" onclick="openStore('${store.id}')">
    <div class="store-card-icon" style="--cat-color:${catInfo.color}">${icon(catInfo.icon, 22)}</div>
    <div class="store-card-body">
      <div class="store-card-top">
        <span class="store-card-name">${escapeHtml(store.name)}</span>
        ${planBadge(store.plan)}
      </div>
      <div class="store-card-meta">
        ${ratingLine(store)}
        <span class="dot">·</span>
        <span>${dist} км</span>
        ${store.verified ? `<span class="dot">·</span>${verifiedBadge(true)}` : ''}
      </div>
      <div class="store-card-addr">${icon('pin', 13)} ${escapeHtml(store.addr)}</div>
      ${opts.showCount !== false ? `<div class="store-card-count">${store.products.length} товар(ов) в категории</div>` : ''}
    </div>
    <span class="store-card-arrow">${icon('chevronRight', 18)}</span>
  </button>`;
}

function productGroupCard(g) {
  const best = storeById(g.offers[0].storeId);
  const cat = categoryById(g.cat);
  return `<button class="listing-card" onclick="openProduct('${encodeURIComponent(g.name)}')">
    <div class="listing-card-photo" style="--cat-color:${cat.color}">
      ${icon(cat.icon, 30, 1.3)}
    </div>
    <div class="listing-card-body">
      <div class="listing-card-name">${escapeHtml(g.name)}</div>
      <div class="listing-card-desc">${g.offers.length} ${offersWord(g.offers.length)} · от «${escapeHtml(best.name)}»</div>
      <div class="listing-card-bottom">
        <span class="listing-card-price">от ${formatPrice(g.minPrice)}</span>
      </div>
    </div>
  </button>`;
}

function offersWord(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'предложение';
  if ([2, 3, 4].includes(mod10) && ![12, 13, 14].includes(mod100)) return 'предложения';
  return 'предложений';
}

function stockBadge(stock) {
  if (stock <= 0) return `<span class="stock stock-out">Нет в наличии</span>`;
  if (stock <= 2) return `<span class="stock stock-low">Осталось ${stock} шт.</span>`;
  return `<span class="stock stock-ok">В наличии</span>`;
}

/* ---------- Карта (переиспользуемый компонент) ---------- */

function renderMapArea(stores, opts) {
  opts = opts || {};
  const selectedId = opts.selectedId;
  const onPinClick = opts.onPinClick || 'selectPin';
  const pins = stores.map(s => {
    const catInfo = categoryById(s.cat);
    const isSel = s.id === selectedId;
    return `<button class="map-pin ${isSel ? 'map-pin-active' : ''} ${s.plan === 'business' ? 'map-pin-top' : ''}"
        style="left:${s.mx}%; top:${s.my}%; --pin-color:${catInfo.color}"
        onclick="${onPinClick}('${s.id}')" title="${escapeHtml(s.name)}">
        ${icon(catInfo.icon, 15, 2)}
      </button>`;
  }).join('');

  const selStore = selectedId ? storeById(selectedId) : null;

  return `<div class="map-wrap">
    <div class="map-canvas">
      ${mapBackgroundSvg()}
      <div class="map-user-pin" style="left:${USER_POS.x}%; top:${USER_POS.y}%">
        <span class="map-user-dot"></span>
        <span class="map-user-pulse"></span>
      </div>
      ${pins}
    </div>
    ${selStore ? `
      <div class="map-sheet">
        <div class="map-sheet-row">
          <div class="store-card-icon" style="--cat-color:${categoryById(selStore.cat).color}">${icon(categoryById(selStore.cat).icon, 20)}</div>
          <div class="map-sheet-info">
            <div class="store-card-top">
              <span class="store-card-name">${escapeHtml(selStore.name)}</span>
              ${planBadge(selStore.plan)}
            </div>
            <div class="store-card-meta">${ratingLine(selStore)}<span class="dot">·</span><span>${distanceKm(selStore)} км</span></div>
          </div>
        </div>
        <div class="map-sheet-actions">
          <a class="btn btn-secondary btn-sm" href="tel:${selStore.phone.replace(/[^+\d]/g, '')}">${icon('phone', 15)} Позвонить</a>
          <button class="btn btn-primary btn-sm" onclick="openStore('${selStore.id}')">Подробнее</button>
        </div>
      </div>` : `
      <div class="map-hint">${icon('crosshair', 15)} Показаны магазины рядом с вами · ${stores.length} на карте</div>
    `}
  </div>`;
}

function mapBackgroundSvg() {
  return `<svg class="map-bg" viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect width="100" height="100" fill="var(--map-bg)"/>
    <rect x="0" y="30" width="100" height="7" fill="var(--map-block)"/>
    <rect x="0" y="63" width="100" height="5" fill="var(--map-block)"/>
    <rect x="22" y="0" width="6" height="100" fill="var(--map-block)"/>
    <rect x="72" y="0" width="5" height="100" fill="var(--map-block)"/>

      <circle cx="12" cy="12" r="6"/>

function isFavorite(listingId) {
  return state.favorites.includes(listingId);
}

function toggleFavorite(listingId) {
  const i = state.favorites.indexOf(listingId);
  if (i >= 0) { state.favorites.splice(i, 1); showToast('Убрано из избранного'); }
  else { state.favorites.push(listingId); showToast('Добавлено в избранное'); }
  render();
}

function favBtn(listingId, size) {
  const fav = isFavorite(listingId);
  return `<button class="fav-btn ${fav ? 'fav-active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${listingId}')" aria-label="В избранное">
    ${icon(fav ? 'heartFilled' : 'heart', size || 15)}
  </button>`;
}

    <button class="chip ${!activeId ? 'chip-active' : ''}" onclick="${onClick}(null)">Все</button>
    ${CATEGORIES.map(c => `<button class="chip ${activeId === c.id ? 'chip-active' : ''}" onclick="${onClick}('${c.id}')">${icon(c.icon, 14)} ${c.name}</button>`).join('')}

function renderCatalogTab() {
  const scr = state.catalogScreen;
  if (scr.name === 'home') return renderHome();
  if (scr.name === 'category') return renderCategoryScreen(scr.catId);
  if (scr.name === 'results') return renderResultsScreen(scr.catId, scr.subId, scr.view || 'list');
  if (scr.name === 'searchResults') return renderSearchResultsScreen(scr.query);
  if (scr.name === 'product') return renderProductScreen(scr.productName);
  if (scr.name === 'store') return renderStoreScreen(scr.storeId);
  if (scr.name === 'listing') return renderListingScreen(scr.listingId);
  if (scr.name === 'photoSearch') return renderPhotoSearchScreen(scr);
  return renderHome();
}

function barcodeMark() {
  const bars = [3,1,2,1,3,2,1,3,1,2,1,3,2,1];
  return `<svg width="30" height="30" viewBox="0 0 30 30"><rect width="30" height="30" rx="7" fill="var(--ink)"/>
    <g transform="translate(5,8)" fill="var(--paper)">
    ${(() => { let x = 0; return bars.map(w => { const r = `<rect x="${x}" y="0" width="${w}" height="14"/>`; x += w + 1; return r; }).join(''); })()}
    </g></svg>`;
}

/* ---------- действия ---------- */

function openCategory(catId) { goCatalog({ name: 'category', catId }); }
function openResults(catId, subId) { state.selectedPinId = null; goCatalog({ name: 'results', catId, subId, view: 'list' }); }
function setResultsView(catId, subId, view) { state.selectedPinId = null; goCatalogReplace({ name: 'results', catId, subId, view }); }
function selectResultsPin(id) { state.selectedPinId = (state.selectedPinId === id ? null : id); render(); }

function doSearch() {
  const input = document.getElementById('searchInput');
  const q = input ? input.value : state.searchQuery;
  state.searchQuery = q;
  if (!q.trim()) return;
  goCatalog({ name: 'searchResults', query: q });
}

function openProduct(nameEncoded) {
  goCatalog({ name: 'product', productName: decodeURIComponent(nameEncoded) });
}

function openStore(storeId) {
  goCatalog({ name: 'store', storeId });
}

function openListing(listingId) {
  goCatalog({ name: 'listing', listingId });
}

function openPhotoSearch() { goCatalog({ name: 'photoSearch', step: 'upload' }); }

function handlePhotoSelected(input) {
  const file = input.files && input.files[0];
  goCatalogReplace({ name: 'photoSearch', step: 'loading' });
  setTimeout(() => {
    const results = photoSearchResults(file || { size: Date.now(), name: 'photo.jpg' });
    goCatalogReplace({ name: 'photoSearch', step: 'results', results });
  }, 1400);
}

   ============================================================ */

function renderMapTab() {
  const stores = sortByPriority(STORES.filter(s => !state.mapTabFilterCat || s.cat === state.mapTabFilterCat));
  return `
    ${topBar('Магазины на карте', { right: `<button class="icon-btn" onclick="locateMe()" title="Моё местоположение">${icon('crosshair', 19)}</button>` })}

  `;
}

function locateMe() {
  if (!navigator.geolocation) { showToast('Геолокация недоступна в этом браузере'); return; }
  showToast('Определяем ваше местоположение…');
  navigator.geolocation.getCurrentPosition(
    () => showToast('Готово — показаны магазины рядом с вами'),
    () => showToast('Не удалось определить местоположение'),
    { timeout: 4000 }
  );
}

function setMapTabFilter(catId) {
  state.mapTabFilterCat = catId;
  state.mapTabSelectedPinId = null;
  render();
}
function selectMapTabPin(id) {
  state.mapTabSelectedPinId = (state.mapTabSelectedPinId === id ? null : id);
  render();
}

/* ============================================================
   МОДАЛКА БРОНИРОВАНИЯ — только имя + телефон, без онлайн-оплаты
   ============================================================ */

function openBooking(storeId, itemNameEncoded, price) {
  state.bookingModal = { storeId, itemName: decodeURIComponent(itemNameEncoded), price };
  state.bookingEditingContact = false;
  render();
}

function renderBookingModal() {
  const m = state.bookingModal;
  const store = storeById(m.storeId);
  const p = state.profile;
  const showForm = !p || state.bookingEditingContact;
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-head">
        <h3>Бронирование</h3>
        <button class="icon-btn" onclick="closeModal()">${icon('close', 18)}</button>
      </div>
      <div class="booking-item">
        <div class="booking-item-name">${escapeHtml(m.itemName)}</div>
        <div class="booking-item-store">${icon('store', 14)} ${escapeHtml(store.name)} · ${escapeHtml(store.addr)}</div>
        <div class="booking-item-price">${formatPrice(m.price)}</div>
      </div>
      <div class="booking-note">${icon('info', 14)} Без онлайн-оплаты. Оплата — на месте, при получении. Бронь действует <b>2 часа</b>, продавец подтвердит её по телефону.</div>
      ${showForm ? `
        <div class="form-field">
          <label>Ваше имя</label>
          <input id="bkName" type="text" value="${p ? escapeHtml(p.name) : ''}" placeholder="Как к вам обращаться" />
        </div>
        <div class="form-field">
          <label>Телефон для связи</label>
          <input id="bkPhone" type="tel" value="${p ? escapeHtml(p.phone) : ''}" placeholder="+7 900 000-00-00" />
        </div>
        ${p ? '' : `<p class="muted contact-hint">${icon('info', 12)} Сохраним эти данные в профиле — в следующий раз форму заполнять не понадобится.</p>`}
      ` : `
        <div class="contact-summary">
          <div>
            <div class="contact-summary-label">${icon('user', 13)} Бронируем на</div>
            <div class="contact-summary-value">${escapeHtml(p.name)} · ${escapeHtml(p.phone)}</div>
          </div>
          <button class="btn btn-outline btn-xs" onclick="state.bookingEditingContact=true; render()">${icon('edit', 13)} Изменить</button>
        </div>
      `}
      <button class="btn btn-primary btn-block" onclick="submitBooking()">${icon('bookmark', 16)} Забронировать</button>
    </div>
  </div>`;
}

function submitBooking() {
  const usingSaved = state.profile && !state.bookingEditingContact;
  let name, phone;
  if (usingSaved) {
    name = state.profile.name;
    phone = state.profile.phone;
  } else {
    name = (document.getElementById('bkName').value || '').trim();
    phone = (document.getElementById('bkPhone').value || '').trim();
    if (!name || !phone) {
      showToast('Укажите имя и телефон');
      return;
    }
    state.profile = { name, phone };
    state.bookingEditingContact = false;
  }

  const m = state.bookingModal;
  const store = storeById(m.storeId);
  const now = Date.now();
  state.bookings.unshift({
    id: uid('bk_'),
    storeId: m.storeId,
    storeName: store.name,
    itemName: m.itemName,
    price: m.price,
    customerName: name,
    customerPhone: phone,
    createdAt: now,
    expiresAt: now + 2 * 60 * 60 * 1000,
    status: 'pending',
  });
  state.bookingModal = null;
  state.tab = 'bookings';
  render();
  showToast(usingSaved ? 'Бронь оформлена — ждём подтверждения' : 'Бронь оформлена, данные сохранены для быстрых броней');
}
/* ============================================================
   ВКЛАДКА «БРОНИ» — брони покупателя
   ============================================================ */

function renderBookingsTab() {
  const list = state.bookings.filter(b => b.status === 'pending' || b.status === 'confirmed');
  return `
    ${topBar('Мои брони', { right: `<button class="icon-btn" onclick="setTab('profile')" title="История">${icon('clock', 18)}</button>` })}
    <div class="content-pad">
      ${list.length ? `<div class="booking-list">${list.map(bookingCard).join('')}</div>` :
        emptyState('Пока нет активных броней', 'Забронируйте товар в карточке товара — он будет ждать вас 2 часа.',
          `<button class="btn btn-primary" onclick="setTab('catalog')">${icon('grid', 15)} Перейти в каталог</button>`)}
      ${state.bookings.length ? `<button class="link-row history-link" onclick="setTab('profile')"><span>${icon('clock', 15)} Вся история покупок</span><span class="chev">${icon('chevronRight', 16)}</span></button>` : ''}
    </div>
  `;
}

function statusInfo(b) {
  if (b.status === 'declined') return { label: 'Отклонено продавцом', cls: 'status-bad' };
  if (b.status === 'confirmed') {
    const left = timeLeftLabel(b.expiresAt);
    return left ? { label: `Подтверждено · ждём вас, осталось ${left}`, cls: 'status-good' }
                : { label: 'Подтверждено · срок брони истёк', cls: 'status-muted' };
  }
  const left = timeLeftLabel(b.expiresAt);
  return left ? { label: `Ожидает подтверждения · ${left}`, cls: 'status-pending' }
              : { label: 'Время брони истекло', cls: 'status-muted' };
}

function bookingCard(b) {
  const st = statusInfo(b);
  const store = storeById(b.storeId);
  return `<div class="booking-card">
    <div class="booking-card-top">
      <div class="booking-card-name">${escapeHtml(b.itemName)}</div>
      <div class="booking-card-price">${formatPrice(b.price)}</div>
    </div>
    <div class="booking-card-store">${icon('store', 13)} ${escapeHtml(b.storeName)} · ${escapeHtml(store ? store.addr : '')}</div>
    <div class="status-pill ${st.cls}">${st.label}</div>
    <div class="booking-card-actions">
      <a class="btn btn-secondary btn-sm" href="tel:${store ? store.phone.replace(/[^+\d]/g, '') : ''}">${icon('phone', 14)} Магазину</a>
      ${store ? `<button class="btn btn-outline btn-sm" onclick="openStore('${store.id}')">Магазин</button>` : ''}
    </div>
  </div>`;
}
/* ============================================================
   ВКЛАДКА «ИЗБРАННОЕ»
   ============================================================ */

function renderFavoritesTab() {
  const items = state.favorites.map(id => listingById(id)).filter(Boolean);
  return `
    ${topBar('Избранное', { spacer: true })}
    <div class="content-pad">
      ${items.length ? cardGrid(items.map(listingCard)) :
        emptyState('Пока пусто', 'Нажимайте на сердечко у товара, чтобы сохранить его здесь.',
          `<button class="btn btn-primary" onclick="setTab('catalog')">${icon('grid', 15)} Перейти в каталог</button>`)}
    </div>
  `;
}

/* ============================================================
   ВКЛАДКА «ПРОФИЛЬ» — личный кабинет покупателя
   ============================================================ */

function renderProfileTab() {
  const p = state.profile;
  return `
    ${topBar('Профиль', { spacer: true })}
    <div class="content-pad">
      <div class="profile-card">
        <div class="profile-avatar">${icon('user', 26)}</div>
        <div class="profile-info">
          <div class="profile-name">${p ? escapeHtml(p.name) : 'Гость'}</div>
          <div class="profile-phone">${p ? escapeHtml(p.phone) : 'Данные для брони не заполнены'}</div>
        </div>
      </div>

      <div class="form-field">
        <label>Имя</label>
        <input id="prName" type="text" value="${p ? escapeHtml(p.name) : ''}" placeholder="Ваше имя" />
      </div>
      <div class="form-field">
        <label>Телефон</label>
        <input id="prPhone" type="tel" value="${p ? escapeHtml(p.phone) : ''}" placeholder="+7 900 000-00-00" />
      </div>
      <button class="btn btn-primary btn-block" onclick="saveProfileFromScreen()">${icon('check', 16)} Сохранить</button>
      <p class="muted small-note">${icon('info', 13)} Эти данные подставляются в форму бронирования автоматически — не нужно вводить их заново для каждой новой брони.</p>

      <div class="section-head"><h2>Быстрый доступ</h2></div>
      <div class="profile-quick-links">
        <button class="quick-link" onclick="setTab('favorites')">
          <span>${icon('heart', 17)} Избранное</span>
          <span class="quick-link-count">${state.favorites.length}</span>
        </button>
        <button class="quick-link" onclick="setTab('bookings')">
          <span>${icon('bookmark', 17)} Активные брони</span>
          <span class="quick-link-count">${activeBookingsCount()}</span>
        </button>
      </div>

      <div class="section-head"><h2>История покупок</h2></div>
      ${state.bookings.length ? `<div class="booking-list">${state.bookings.map(bookingCard).join('')}</div>`
        : emptyState('Пока пусто', 'Здесь появится история всех ваших броней.')}
    </div>
  `;
}

function saveProfileFromScreen() {
  const name = (document.getElementById('prName').value || '').trim();
  const phone = (document.getElementById('prPhone').value || '').trim();
  if (!name || !phone) { showToast('Заполните имя и телефон'); return; }
  state.profile = { name, phone };
  showToast('Профиль сохранён');
  render();
}
/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */

// Обновляем счётчик «осталось N минут» на вкладке «Брони»,
// не трогая остальной интерфейс.
setInterval(() => {
  if (state.tab === 'bookings' || state.tab === 'profile') render();
}, 30000);

render();
</script>
</body>
</html>
