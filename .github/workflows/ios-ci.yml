name: iOS CI

on:
  push:
    paths:
      - "apps/customer-ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "apps/customer-ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/customer-ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project CustomerApp.xcodeproj -scheme CustomerApp -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
