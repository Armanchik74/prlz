name: CustomerApp
options:
  bundleIdPrefix: ru.est-ryadom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    API_BASE_URL: "http://127.0.0.1:8080/api/v1"
targets:
  CustomerApp:
    type: application
    platform: iOS
    sources:
      - CustomerApp
    info:
      path: CustomerApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Есть рядом"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Показываем товары и магазины рядом с вами."
        NSCameraUsageDescription: "Камера нужна для поиска товара по фотографии."
        NSPhotoLibraryUsageDescription: "Выберите фотографию товара для поиска похожих предложений."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: "$(API_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.est-ryadom.customer
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
