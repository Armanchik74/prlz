<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Кабинет продавца — маркетплейс товаров</title>
<style>
/* ============================================================
   КАБИНЕТ ПРОДАВЦА — СТИЛИ ПРОТОТИПА
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700;800&display=swap');

:root {
  --ink: #1C231F;
  --ink-soft: #4B5450;
  --muted: #74807A;
  --paper: #F3F1E9;
  --surface: #FFFFFF;
  --surface-2: #EAE7DB;
  --line: #E1DDCE;
  --line-strong: #CFC9B6;

  --primary: #1F3D3A;
  --primary-dark: #142826;
  --primary-tint: #E4EBE6;

  --accent: #FF6A3D;
  --accent-dark: #E15420;
  --accent-tint: #FFE6DB;

  --success: #2F9E67;
  --success-tint: #E2F4EA;
  --warning: #D98B1F;
  --warning-tint: #FBEDD7;
  --danger: #D6483F;
  --danger-tint: #FBE4E1;

  --font-display: 'Unbounded', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow-card: 0 1px 2px rgba(28,35,31,0.05), 0 6px 16px -8px rgba(28,35,31,0.12);
  --shadow-pop: 0 20px 50px -12px rgba(20,25,22,0.35);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: #DAD5C4;
  -webkit-font-smoothing: antialiased;
}
#root { height: 100%; }
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
ul { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* ---------- КАРКАС ПРИЛОЖЕНИЯ ---------- */

.app-shell {
  position: relative;
  height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  background: var(--paper);
  overflow: hidden;
}

@media (min-width: 660px) {
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5), transparent 45%),
      repeating-linear-gradient(90deg, #CFC9B4 0 3px, transparent 3px 26px),
      #DAD5C4;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 0;
  }
  .app-shell {
    height: 872px;
    max-height: calc(100vh - 56px);
    border-radius: 34px;
    box-shadow: var(--shadow-pop);
    border: 1px solid rgba(20,25,22,0.08);
  }
}

#app { display: flex; flex-direction: column; height: 100%; position: relative; }
.screen-scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.content-pad { padding: 4px 18px 28px; }
.content-pad-fab { padding-bottom: 96px; }

/* ---------- ШАПКА ---------- */

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 12px 10px;
  position: sticky; top: 0; z-index: 5;
  background: var(--paper);
}
.topbar-title { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 11px; border: none;
  background: var(--surface-2); color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.icon-btn-spacer { width: 36px; height: 36px; flex-shrink: 0; }

/* ---------- НИЖНЯЯ НАВИГАЦИЯ ---------- */

.bottom-nav {
  flex-shrink: 0;
  display: flex;
  border-top: 1px solid var(--line);
  background: var(--surface);
  padding: 7px 6px calc(env(safe-area-inset-bottom, 0px) + 7px);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; padding: 6px 2px; color: var(--muted);
  border-radius: 12px;
}
.nav-btn.active { color: var(--primary); }
.nav-ico { position: relative; display: inline-flex; }
.nav-label { font-size: 10.5px; font-weight: 600; }
.nav-badge {
  position: absolute; top: -4px; right: -8px;
  background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 700;
  min-width: 15px; height: 15px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
}

/* ---------- ТОСТ ---------- */

.toast {
  position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 11px 16px; border-radius: 999px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 600;
  box-shadow: 0 10px 30px -8px rgba(0,0,0,0.5);
  z-index: 50; max-width: calc(100% - 40px);
  animation: toast-in 0.22s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- КНОПКИ ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: none; border-radius: var(--radius-sm);
  font-family: var(--font-body); font-weight: 700; font-size: 14px;
  padding: 12px 16px; white-space: nowrap;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn-block { display: flex; width: 100%; margin-top: 10px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--primary-tint); color: var(--primary); }
.btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--line-strong); }
.btn-sm { padding: 8px 12px; font-size: 12.5px; border-radius: 9px; }
.btn-xs { padding: 6px 10px; font-size: 11.5px; border-radius: 8px; }

.fab {
  position: absolute; right: 18px; bottom: 78px;
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 24px -6px rgba(255,106,61,0.55);
  z-index: 10;
}
.fab:active { transform: scale(0.94); }

/* ---------- РАЗДЕЛЫ / ЗАГОЛОВКИ ---------- */

.section-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin: 22px 0 12px;
}
.section-head h2 { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; }
.section-sub { font-size: 12px; color: var(--muted); font-weight: 500; }

/* ---------- ИКОНКА МАГАЗИНА / БЕЙДЖИ ---------- */

.store-card-icon {
  width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
  background: color-mix(in srgb, var(--cat-color) 14%, white); color: var(--cat-color);
  display: flex; align-items: center; justify-content: center;
}
.store-card-icon-sm { width: 34px; height: 34px; border-radius: 10px; }
.store-card-icon-lg { width: 56px; height: 56px; border-radius: 16px; }
.dot { color: var(--line-strong); }

.badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 800; padding: 2.5px 6px; border-radius: 6px;
  text-transform: uppercase; letter-spacing: 0.02em;
}
.badge-business { background: var(--accent-tint); color: var(--accent-dark); }
.badge-verified { background: var(--primary-tint); color: var(--primary); text-transform: none; letter-spacing: 0; }

.stock { font-size: 11px; font-weight: 700; display: inline-block; margin-top: 3px; }
.stock-ok { color: var(--success); }
.stock-low { color: var(--warning); }
.stock-out { color: var(--danger); }

/* ---------- ПУСТЫЕ СОСТОЯНИЯ ---------- */

.empty-state { text-align: center; padding: 46px 16px; }
.empty-ico { width: 58px; height: 58px; border-radius: 16px; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
.empty-title { font-size: 14.5px; font-weight: 700; }
.empty-sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.empty-state .btn { margin: 16px auto 0; }

/* ---------- ФОРМЫ ---------- */

.form-field { margin-bottom: 13px; }
.form-field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.form-field input, .form-field select, .form-field textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface);
  border-radius: 11px; padding: 12px 13px; font-size: 14px; outline: none;
  font-family: inherit;
}
.form-field textarea { resize: vertical; min-height: 76px; line-height: 1.5; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--primary); }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.inline-input-row { display: flex; gap: 8px; }
.inline-input-row input { flex: 1; }

.photo-upload-box {
  display: flex; align-items: center; justify-content: center;
  width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-md);
  border: 1.5px dashed var(--line-strong); background: var(--surface-2);
  overflow: hidden; cursor: pointer;
}
.photo-upload-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.photo-upload-placeholder { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
.photo-upload-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.btn-text-danger {
  margin-top: 8px; background: none; border: none; color: var(--danger);
  font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; padding: 2px 0;
}

/* ---------- БРОНИ ---------- */

.booking-list { display: flex; flex-direction: column; gap: 10px; }
.booking-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px; box-shadow: var(--shadow-card); }
.booking-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.booking-card-name { font-size: 14px; font-weight: 700; }
.booking-card-price { font-weight: 700; font-size: 13.5px; flex-shrink: 0; }
.booking-card-store { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.booking-card-actions { display: flex; gap: 8px; margin-top: 12px; }
.booking-card-actions .btn { flex: 1; }

.status-pill { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 6px 11px; border-radius: 8px; margin-top: 10px; }
.status-pending { background: var(--warning-tint); color: var(--warning); }
.status-good { background: var(--success-tint); color: var(--success); }
.status-bad { background: var(--danger-tint); color: var(--danger); }
.status-muted { background: var(--surface-2); color: var(--muted); }

/* ---------- ОБЗОР ---------- */

.seller-id-card { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
.seller-id-name { font-size: 16px; font-weight: 700; }
.seller-id-addr { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 4px; }

.tariff-mini-card {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--primary); color: #fff; border-radius: var(--radius-md); padding: 14px 15px; margin-bottom: 16px;
}
.tariff-mini-label { font-size: 11px; opacity: 0.75; font-weight: 600; }
.tariff-mini-name { font-size: 14px; font-weight: 700; margin-top: 3px; }
.tariff-mini-card .btn-outline { border-color: rgba(255,255,255,0.5); color: #fff; }

.limit-bar-wrap { margin-bottom: 18px; }
.limit-bar-label { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.limit-bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.limit-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 10px; }
.stat-tile-label { font-size: 10.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.stat-tile-value { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin-top: 8px; }
.stat-tile-locked { position: relative; }
.stat-tile-value.blurred { filter: blur(4px); opacity: 0.6; user-select: none; }
.stat-tile-lock { font-size: 9px; color: var(--muted); font-weight: 700; margin-top: 6px; display: flex; align-items: center; gap: 3px; }

.priority-banner {
  display: flex; align-items: center; gap: 8px;
  background: var(--accent-tint); color: var(--accent-dark); font-weight: 700; font-size: 12.5px;
  padding: 12px 14px; border-radius: var(--radius-md); margin-bottom: 14px;
}
.heatmap-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px; }
.heatmap-title { font-size: 12.5px; font-weight: 700; margin-bottom: 11px; }
.heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.heat-cell { display: block; aspect-ratio: 1; border-radius: 4px; background: color-mix(in srgb, var(--success) calc(var(--h) * 10%), var(--surface-2)); }
.heatmap-legend { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 8px; font-weight: 600; }

/* ---------- ТОВАРЫ ---------- */

.seller-product-list { display: flex; flex-direction: column; gap: 8px; }
.seller-product-row { display: flex; align-items: center; gap: 11px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px 11px; }
.seller-product-thumb-img { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
.seller-product-info { flex: 1; min-width: 0; }
.seller-product-name { font-size: 13px; font-weight: 700; }
.seller-product-desc { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.seller-product-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.seller-product-actions { display: flex; gap: 5px; flex-shrink: 0; }
.icon-btn-sm { width: 30px; height: 30px; border-radius: 9px; border: none; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--ink-soft); }

.choice-card {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
  padding: 15px; margin-bottom: 10px; box-shadow: var(--shadow-card);
}
.choice-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--primary-tint); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.choice-text { flex: 1; }
.choice-title { font-size: 13.5px; font-weight: 700; }
.choice-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

.scan-fill-banner {
  display: flex; align-items: center; gap: 7px; background: var(--success-tint); color: var(--success);
  font-size: 12px; font-weight: 700; padding: 10px 13px; border-radius: 10px; margin-bottom: 14px;
}

.scanner-frame {
  position: relative; aspect-ratio: 4/3; border-radius: var(--radius-lg); overflow: hidden;
  background: #101512; margin-top: 6px;
}
.scanner-video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner-fallback { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; text-align: center; padding: 20px; }
.scanner-reticle {
  position: absolute; left: 12%; right: 12%; top: 32%; bottom: 32%;
  border: 2.5px solid rgba(255,255,255,0.85); border-radius: 14px;
  box-shadow: 0 0 0 999px rgba(0,0,0,0.35);
}
.scanner-laser {
  position: absolute; left: 4%; right: 4%; top: 0; height: 2px; background: var(--accent);
  box-shadow: 0 0 8px 1px var(--accent);
  animation: laser 1.8s ease-in-out infinite;
}
@keyframes laser { 0% { top: 6%; } 50% { top: 92%; } 100% { top: 6%; } }
.scanner-status { text-align: center; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin: 14px 0 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.scanner-manual { border-top: 1px solid var(--line); padding-top: 16px; }

.import-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; }
.import-block h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
.import-block .muted { margin-bottom: 12px; }
.import-block .btn-block:first-of-type { margin-top: 0; }

.lock-panel { text-align: center; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); padding: 32px 20px; color: var(--muted); }
.lock-panel svg { color: var(--muted); margin-bottom: 12px; }
.lock-panel p { font-size: 13px; line-height: 1.6; color: var(--ink-soft); margin-bottom: 16px; }
.lock-panel .btn { margin: 0 auto; }

.muted { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.small-note { display: flex; align-items: flex-start; gap: 6px; margin-top: 18px; }

.pill-soon, .pill-lock { display: inline-block; font-size: 9.5px; font-weight: 800; text-transform: uppercase; background: var(--warning-tint); color: var(--warning); padding: 2px 6px; border-radius: 5px; margin-left: 4px; vertical-align: middle; }
.pill-lock { background: var(--surface-2); color: var(--muted); }

/* ---------- ТАРИФЫ ---------- */

.tariff-list { display: flex; flex-direction: column; gap: 14px; }
.tariff-card {
  position: relative; background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--radius-lg); padding: 20px 18px; box-shadow: var(--shadow-card);
}
.tariff-current { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.tariff-popular { border-color: var(--accent); }
.tariff-ribbon {
  position: absolute; top: -11px; left: 18px; background: var(--accent); color: #fff;
  font-size: 10.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.02em;
}
.tariff-current-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--primary-tint); color: var(--primary); font-size: 10.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; margin-bottom: 10px; }
.tariff-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.tariff-price { font-family: var(--font-display); font-size: 25px; font-weight: 700; margin-top: 6px; }
.tariff-price span { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--muted); }
.tariff-tagline { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tariff-features { margin: 16px 0; display: flex; flex-direction: column; gap: 9px; }
.tariff-features li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
.tariff-features li svg { flex-shrink: 0; color: var(--success); }
.tariff-features li.feat-off { color: var(--muted); font-weight: 500; }
.tariff-features li.feat-off svg { color: var(--line-strong); }

/* ---------- УТИЛИТЫ ---------- */

@media (max-width: 359px) {
  .content-pad { padding-left: 14px; padding-right: 14px; }
}
</style>
</head>
<body>
<div id="root">
  <div class="app-shell">
    <div id="app"></div>
  </div>
</div>
<script>
/* ============================================================
   ДАННЫЕ — ЛИЧНЫЙ КАБИНЕТ ПРОДАВЦА
   ============================================================ */

const CATEGORIES = [
  { id: 'electronics', name: 'Электроника', icon: 'cpu', color: '#2F5D8A' },
  { id: 'tools', name: 'Инструменты', icon: 'wrench', color: '#B5541A' },
  { id: 'building', name: 'Стройматериалы', icon: 'brick', color: '#8A6A2F' },
  { id: 'household', name: 'Хозтовары', icon: 'home', color: '#3E7C5C' },
  { id: 'auto', name: 'Автотовары', icon: 'car', color: '#4A4A6A' },
  { id: 'sport', name: 'Спорт и отдых', icon: 'dumbbell', color: '#1F7A6C' },
  { id: 'clothing', name: 'Одежда и обувь', icon: 'shirt', color: '#8A3A5A' },
];

function categoryById(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }

// Профиль магазина, от лица которого работает продавец в этом кабинете.
// Каталог и адрес намеренно совпадают с «ТехноМир» из покупательского приложения —
// это один и тот же магазин, только с двух разных сторон.
const MY_STORE = {
  name: 'ТехноМир',
  cat: 'electronics',
  addr: 'просп. Победы, 24',
  phone: '+7 900 111-22-33',

function lookupBarcode(code) {
  const hit = BARCODE_DB.find(b => b.code === code.trim());
  if (hit) return hit;
  const seed = code.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  return BARCODE_DB[seed % BARCODE_DB.length];
}

function randomBarcodeHit() {
  return BARCODE_DB[Math.floor(Math.random() * BARCODE_DB.length)];

function formatPrice(n) {
  return n.toLocaleString('ru-RU') + ' ₽';
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function timeLeftLabel(expiresAt) {
  const ms = expiresAt - Date.now();
  if (ms <= 0) return null;
  const totalMin = Math.ceil(ms / 60000);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  if (h > 0) return `${h} ч ${m} мин`;
  return `${m} мин`;
}

function uid(prefix) {
  return prefix + Math.random().toString(36).slice(2, 9);
}

  return `<header class="topbar">

// Фото читается на клиенте (FileReader) и хранится как data URL — без загрузки на сервер,
// достаточно для прототипа. Превью обновляется точечно, чтобы не сбрасывать остальные поля формы.
function handlePhotoUpload(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type || !file.type.startsWith('image/')) { showToast('Выберите файл изображения'); return; }
  const reader = new FileReader();
  reader.onload = function (e) {
    state.formPhoto = e.target.result;
    updatePhotoPreviewDom();
  };
  reader.readAsDataURL(file);
}

function removePhoto() {
  state.formPhoto = null;
  updatePhotoPreviewDom();
}

function updatePhotoPreviewDom() {
  const content = document.getElementById('photoUploadContent');
  if (content) content.innerHTML = photoPreviewInner(state.formPhoto);
  const removeWrap = document.getElementById('photoRemoveWrap');
  if (removeWrap) removeWrap.innerHTML = state.formPhoto ? removePhotoButtonHtml() : '';

function editSellerProduct(id) {
  state.editingProductId = id;

function cancelAddManual() {
  state.editingProductId = null;

function saveSellerProduct() {
  const name = (document.getElementById('pfName').value || '').trim();
  const cat = document.getElementById('pfCat').value;
  const price = parseInt(document.getElementById('pfPrice').value, 10);
  const stockRaw = parseInt(document.getElementById('pfStock').value, 10);
  const stock = isNaN(stockRaw) ? 0 : stockRaw;
  const desc = (document.getElementById('pfDesc').value || '').trim();
  const photo = state.formPhoto || null;
  if (!name || !price || price <= 0) { showToast('Заполните название и цену'); return; }

  if (state.editingProductId) {
    const p = state.sellerProducts.find(p => p.id === state.editingProductId);
    Object.assign(p, { name, cat, price, stock, desc, photo });
    state.editingProductId = null;
    state.scannerPrefill = null;
    state.formPhoto = null;
    goProductsScreen('list');
    showToast('Изменения сохранены');
    return;
  }

  const tariff = getTariff(state.sellerTariff);
  if (state.sellerProducts.length >= tariff.limit) {
    showToast(`Лимит тарифа «${tariff.name}» — ${tariff.limit} товаров. Смените тариф`);
    return;
  }
  state.sellerProducts.push({ id: uid('p_'), name, cat, price, stock, desc, photo });
  state.scannerPrefill = null;
  state.formPhoto = null;
  goProductsScreen('list');
  showToast('Товар добавлен');
}

function deleteSellerProduct(id, fromEdit) {
  state.sellerProducts = state.sellerProducts.filter(p => p.id !== id);

let scannerStream = null;

function renderScanner() {
  return `
    ${topBar('Сканер штрихкодов', { onBack: "goProductsScreen('add-choice')" })}
    <div class="content-pad">
      <div class="scanner-frame" id="scannerFrame">

        <div class="scanner-fallback" id="scannerFallback" style="display:none">
          ${icon('camera', 30, 1.4)}
          <p>Камера недоступна в этом окне</p>
        </div>
        <div class="scanner-reticle"><span class="scanner-laser"></span></div>
      </div>
      <p class="scanner-status" id="scanStatus">${icon('crosshair', 15)} Наведите камеру на штрихкод товара…</p>

      <div class="scanner-manual">
        <div class="form-field">
          <label>Или введите код вручную</label>
          <div class="inline-input-row">
            <input id="manualBarcode" type="text" inputmode="numeric" placeholder="4600123456789" />
            <button class="btn btn-secondary btn-sm" onclick="submitManualBarcode()">Найти</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function startScannerFlow() {
  const video = document.getElementById('scanVideo');
  const fallback = document.getElementById('scannerFallback');
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
      scannerStream = stream;
      if (video) video.srcObject = stream;
    }).catch(() => {
      if (video) video.style.display = 'none';
      if (fallback) fallback.style.display = 'flex';
    });
  } else {
    if (video) video.style.display = 'none';
    if (fallback) fallback.style.display = 'flex';
  }
  scheduleDetection();
}

function scheduleDetection() {
  setTimeout(() => {
    if (state.productsScreen !== 'scanner') return;
    const statusEl = document.getElementById('scanStatus');
    if (statusEl) statusEl.innerHTML = icon('loader', 15) + ' Распознаём штрихкод…';
    setTimeout(() => {
      if (state.productsScreen !== 'scanner') return;
      applyBarcodeHit(randomBarcodeHit());
    }, 900);
  }, 1700);
}

function stopScanner() {
  if (scannerStream) {
    scannerStream.getTracks().forEach(t => t.stop());
    scannerStream = null;
  }
}

function applyBarcodeHit(hit) {
  stopScanner();
  state.scannerPrefill = { name: hit.name, cat: hit.cat, price: hit.price, stock: 1, desc: hit.desc || '' };
  state.editingProductId = null;
  state.formPhoto = null;
  goProductsScreen('add-manual');
  showToast('Штрихкод распознан: ' + hit.name);
}

function submitManualBarcode() {
  const val = (document.getElementById('manualBarcode').value || '').trim();
  if (!val) { showToast('Введите штрихкод'); return; }
  applyBarcodeHit(lookupBarcode(val));
}

          <p class="muted">Загрузите файл со столбцами: Название, Категория, Цена, Остаток. Тариф «${tariff.name}»: лимит ${tariff.limit} товаров.</p>
          <button class="btn btn-outline btn-block" onclick="downloadCsvTemplate()">${icon('file', 16)} Скачать шаблон</button>
          <label class="btn btn-primary btn-block">
            ${icon('upload', 16)} Загрузить файл
            <input type="file" accept=".csv" style="display:none" onchange="handleCsvImport(this)" />
          </label>
        </div>
      `}

  `;

function csvCell(v) {
  const s = String(v);
  return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCsv(rows, filename) {
  const csv = '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function exportProductsCsv() {
  const rows = [['Название', 'Категория', 'Цена', 'Остаток', 'Описание']];
  state.sellerProducts.forEach(p => rows.push([p.name, categoryById(p.cat).name, p.price, p.stock, p.desc || '']));
  downloadCsv(rows, 'tovary.csv');
  showToast('Файл выгружен');
}

function downloadCsvTemplate() {
  const rows = [['Название', 'Категория', 'Цена', 'Остаток', 'Описание'], ['Перфоратор Bosch GBH 2-26', 'Инструменты', 8990, 4, 'Оригинал, кейс и три бура в комплекте']];
  downloadCsv(rows, 'shablon.csv');
}

function handleCsvImport(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const text = String(e.target.result || '');
    const lines = text.split(/\r?\n/).filter(l => l.trim().length);
    const tariff = getTariff(state.sellerTariff);
    let added = 0;
    lines.slice(1).forEach(line => {
      if (state.sellerProducts.length >= tariff.limit) return;
      const cols = line.split(';').map(c => c.replace(/^"|"$/g, '').trim());
      const name = cols[0];
      const catName = cols[1];
      const price = parseInt(cols[2], 10);
      const stockRaw = parseInt(cols[3], 10);
      const desc = cols[4] || '';
      if (!name || !price) return;
      const catObj = CATEGORIES.find(c => c.name === catName) || CATEGORIES[0];
      state.sellerProducts.push({ id: uid('p_'), name, cat: catObj.id, price, stock: isNaN(stockRaw) ? 1 : stockRaw, desc, photo: null });
      added++;
    });
    goProductsScreen('list');
    showToast(added ? `Импортировано ${added} товар(ов)` : 'Не удалось распознать файл');
  };
  reader.readAsText(file, 'UTF-8');
}

    return left ? { label: `Подтверждено · ждём покупателя, осталось ${left}`, cls: 'status-good' }
                : { label: 'Подтверждено · срок брони истёк', cls: 'status-muted' };

  const left = timeLeftLabel(b.expiresAt);
  return left ? { label: `Ожидает подтверждения · ${left}`, cls: 'status-pending' }
              : { label: 'Время брони истекло', cls: 'status-muted' };
}

  `;
}

function tariffCard(t) {
  const isCurrent = state.sellerTariff === t.id;
  return `<div class="tariff-card ${isCurrent ? 'tariff-current' : ''} ${t.popular ? 'tariff-popular' : ''}">
    ${t.popular ? `<div class="tariff-ribbon">Популярный</div>` : ''}
    ${isCurrent ? `<div class="tariff-current-badge">${icon('checkCircle', 13)} Ваш тариф</div>` : ''}
    <div class="tariff-name">${t.name}</div>
    <div class="tariff-price">${t.price.toLocaleString('ru-RU')} ₽<span>/мес</span></div>
    <div class="tariff-tagline">${t.tagline}</div>
    <ul class="tariff-features">
      ${t.features.map(f => `<li class="${f.included ? '' : 'feat-off'}">${icon(f.included ? 'check' : 'close', 14)} ${f.text}${f.release2 ? ' <span class="pill-soon">Скоро</span>' : ''}</li>`).join('')}
    </ul>
    <button class="btn ${isCurrent ? 'btn-outline' : 'btn-primary'} btn-block" ${isCurrent ? 'disabled' : ''} onclick="chooseTariff('${t.id}')">${isCurrent ? 'Текущий тариф' : 'Выбрать тариф'}</button>
  </div>`;
}

function chooseTariff(id) {
  state.sellerTariff = id;
  setTab('tariffs');
  showToast('Тариф изменён на «' + getTariff(id).name + '»');
}
/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */

setInterval(() => {
  if (state.tab === 'bookings') render();
}, 30000);

render();
</script>
</body>
</html>
